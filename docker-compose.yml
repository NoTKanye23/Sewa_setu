services:
  db:
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"     # lets evals/run_claude.sh on the host check the database
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    restart: unless-stopped
    build: ./app
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      # per-officer logins for the officer assistant: "name:password:Block,name2:password2"
      OFFICERS: ${OFFICERS:-}
      # the address at which people reach this portal; stamped into sign-in tokens and
      # discovery documents, so it must be the public one when deployed
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  citizen-mcp:
    restart: unless-stopped
    build: {context: ., dockerfile: mcp_service/Dockerfile}
    command: ["python", "citizen_server.py"]
    environment: &mcp_env
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_INTERNAL_URL: http://app:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    depends_on: [db, app]
    volumes:
      - uploads:/var/sewasetu/uploads

  officer-mcp:
    restart: unless-stopped
    build: {context: ., dockerfile: mcp_service/Dockerfile}
    command: ["python", "officer_server.py"]
    environment:
      <<: *mcp_env
      PORT: "8002"
    depends_on: [db, app]
    volumes:
      - uploads:/var/sewasetu/uploads

  caddy:
    restart: unless-stopped
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app, citizen-mcp, officer-mcp]

  evals:
    build: {context: ., dockerfile: evals/Dockerfile}
    profiles: ["evals"]       # docker compose run --rm evals
    # share caddy's network so PUBLIC_BASE_URL (even http://localhost) reaches the real front door
    network_mode: "service:caddy"
    environment:
      PORTAL_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SMS_URL: http://smsgw:8025
      CITIZEN_MCP: ${PUBLIC_BASE_URL:-http://localhost:8000}/mcp/citizen
      OFFICER_MCP: ${PUBLIC_BASE_URL:-http://localhost:8000}/mcp/officer
      OFFICER_LOGINS: ${OFFICER_LOGINS:-}
    depends_on: [caddy]
    volumes:
      - uploads:/var/sewasetu/uploads

  scheduler:
    restart: unless-stopped
    build: ./app
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    restart: unless-stopped
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  caddydata:
  pgdata:
  uploads:
  applogs:
